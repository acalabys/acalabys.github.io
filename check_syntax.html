<!DOCTYPE html>
<html>
<body>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.log('Error: ' + msg + ' at ' + lineNo + ':' + columnNo);
      fetch('/log?msg=' + encodeURIComponent(msg + ' at ' + lineNo + ':' + columnNo));
      return false;
    };
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
